[General]
; Remove temporary folders on boot (equivalent to WinUtil DeleteTempFiles)
delete_temp_files = true

; Run Windows Disk Cleanup & DISM on boot (cleanmgr.exe + Dism.exe)
; Disabled by default because DISM /ResetBase can take 15+ minutes
disk_cleanup = false

[OrganizeDownloads]
; Automatically organize Downloads folder on boot
enabled = true

; Path to the downloads directory to organize (if empty, uses default Windows Downloads folder)
target_directory = D:\Downloads

[Folders]
; FolderName = .ext1, .ext2, .ext3 ...
Archives = .zip, .rar, .7z, .tar, .gz, .bz2, .xz, .iso
PowerPoint = .ppt, .pptx, .pps, .ppsx, .potx
PDF = .pdf
Word = .doc, .docx, .dotx, .odt, .rtf
Excel = .xls, .xlsx, .xlsm, .csv
Images = .jpg, .jpeg, .png, .gif, .bmp, .svg, .webp, .ico, .tiff
Videos = .mp4, .mkv, .mov, .avi, .wmv, .flv, .webm
Audio = .mp3, .wav, .flac, .aac, .ogg, .m4a
Installers = .exe, .msi
Code = .cpp, .hpp, .c, .h, .py, .js, .ts, .html, .css, .json, .xml
Torrents = .torrent
